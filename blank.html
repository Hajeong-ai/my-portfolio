<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --text: #f9fafb;
      --accent: #a3e635; /* 연한 라임색 포인트 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "SF Pro Display","SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      animation: fadeIn 1s ease forwards;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: #9ca3af;
    }

    .dot {
      display: inline-block;
      width: 0.6em;
      height: 0.6em;
      margin-left: 0.2em;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.4s infinite both;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Coming Soon<span class="dot"></span></h1>
    <p>Please wait a little longer while I finish this page ✨</p>
  </main>
</body>
</html>
